<!-- Blokken met onze code over de volle breedte, zonder witregel bovenaan of rand opzij
     (GHL zet padding op sectie, rij en kolom, en op /de een maximale breedte van 1170 px). -->
<style>
.c-section:has(.srp:not(.fkop)),.c-row:has(.srp:not(.fkop)),.c-column:has(.srp:not(.fkop)){padding:0!important}
.c-section:has(.srp:not(.fkop))>.inner{max-width:none!important}
</style>
<!-- Knopklikken als Clarity-event, en "Brochure" laten springen naar het formulier met klasse sr-brochure
     (GHL-formulieren hebben een vaste ID; het brochureformulier heeft in GHL de Custom Class "sr-brochure"). -->
<script>
document.addEventListener('click',function(e){
  var a=e.target.closest&&e.target.closest('.srp a[href^="#sr-"]'); if(!a) return;
  var h=a.getAttribute('href');
  if(h==='#sr-brochure' && !document.getElementById('sr-brochure')){
    var f=document.querySelector('.sr-brochure'); f=f&&(f.closest('.c-column')||f);
    if(f){ e.preventDefault(); f.scrollIntoView({behavior:'smooth',block:'start'}); }
  }
  if(!window.clarity) return;
  var taal=(a.closest('.srp').getAttribute('lang')||'nl');
  try{ clarity('event', h==='#sr-brochure' ? 'cta_brochure' : 'cta_verkoopweekend');
       clarity('set','taal',taal); }catch(err){}
});
</script>
