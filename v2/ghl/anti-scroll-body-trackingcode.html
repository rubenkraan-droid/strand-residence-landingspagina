<!-- Staat in GHL bij funnel Strand Residence > Settings > Body tracking code (alle stappen). Anti-scroll v2 tegen de Meta/Facebook in-app browser (skill landingspagina, snippet 1). -->
<script>
(function () {
  try { if ('scrollRestoration' in history) history.scrollRestoration = 'manual'; } catch (e) {}
  var armed = true;
  ['pointerdown', 'touchstart', 'mousedown', 'keydown', 'wheel'].forEach(function (ev) {
    window.addEventListener(ev, function () { armed = false; }, { once: true, passive: true });
  });
  function top() {
    if (!armed) return;
    var a = document.activeElement;
    if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) { try { a.blur(); } catch (e) {} }
    window.scrollTo(0, 0);
  }
  document.addEventListener('focusin', function () { if (armed) top(); }, true);
  var eind = Date.now() + 4000;
  var iv = setInterval(function () { if (!armed || Date.now() > eind) { clearInterval(iv); return; } top(); }, 100);
  document.addEventListener('DOMContentLoaded', top);
  if (document.readyState === 'complete') top(); else window.addEventListener('load', top);
})();
</script>
